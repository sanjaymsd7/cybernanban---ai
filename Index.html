<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/jpeg" href="Cyber_Nanban_Full_Logo.jpg">
<meta name="theme-color" content="#050b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cyber Nanban AI">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Nanban AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      text-align: center;
    }
    header { padding: 35px 15px; }
    h1 { color: #38bdf8; font-size: 32px; }
    p { color: #b8c7d9; }
    main {
      max-width: 650px;
      margin: 20px auto;
      padding: 20px;
    }
    .chat {
      background: #14243a;
      padding: 20px;
      border-radius: 14px;
    }
    textarea {
      width: 95%;
      height: 100px;
      padding: 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      margin-top: 15px;
      padding: 12px 25px;
      background: #0284c7;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }
    footer { margin-top: 40px; color: #8293a8; }
  </style>
</head>
<body>
  <header>
    <h1>🛡️ Cyber Nanban AI</h1>
    <p>Your Friendly AI Cybersecurity Assistant</p>
  </header>

  <main>
    <div class="chat">
      <h2>Ask Cyber Nanban</h2>
      <p>Learn cybersecurity, ethical hacking and VAPT.</p>
      <textarea placeholder="Ask your cybersecurity question..."></textarea>
      <br>
      <button onclick="alert('AI connection will be added in the next step!')">
        Ask AI
      </button>
    </div>
    <footer>
      Educational use only • Practice in authorized labs
    </footer>
  </main>
  <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
  </script>
</body>
</html>
