
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b00000">
<link rel="apple-touch-icon" href="Cyber_Nanban_Icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <link rel="manifest" href="/manifest.json">

  <title>CyberNanban AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #263449;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 27px;
    }

    header h2 {
      margin: 0;
      font-size: 21px;
    }

    header p {
      margin: 4px 0 0;
      color: #94a3b8;
      font-size: 12px;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .welcome {
      text-align: center;
      margin: auto 0 25px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #94a3b8;
      line-height: 1.6;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 150px;
    }

    .message {
      padding: 14px 17px;
      border-radius: 17px;
      max-width: 90%;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #2563eb;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .bot {
      background: #1e293b;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      align-items: center;
    }

    #question {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
      resize: none;
      min-height: 30px;
      max-height: 120px;
      padding: 8px;
      font-family: inherit;
    }

    #question::placeholder {
      color: #94a3b8;
    }

    #send {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #quote {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin: 18px 0;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 15px;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px;
      }

      main {
        padding: 12px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      #send {
        padding: 12px;
      }

      .message {
        max-width: 95%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🛡️</div>
  <div>
    <h2>CyberNanban AI</h2>
    <p>Your friendly cybersecurity assistant</p>
  </div>
</header>

<main>

  <section class="welcome">
    <h1>Hello, நண்பா! 👋</h1>
    <p>
      Welcome to CyberNanban AI.<br>
      Ask anything about cybersecurity,
      ethical hacking, networking and technology.
    </p>
  </section>

  <div id="chat"></div>

  <div class="input-area">
    <textarea
      id="question"
      rows="1"
      placeholder="Ask anything..."
      aria-label="Ask CyberNanban AI"
    ></textarea>

    <button id="send" aria-label="Send message">➤</button>
  </div>

  <div id="quote">
    வென்றால் மகிழ்ச்சி, தோற்றால் பயிற்சி! 💪
  </div>

  <footer>
    CyberNanban AI • Learn. Practice. Protect.
  </footer>

</main>

<script>
  const chat = document.getElementById("chat");
  const question = document.getElementById("question");
  const send = document.getElementById("send");

  const quotes = [
    "வென்றால் மகிழ்ச்சி, தோற்றால் பயிற்சி! 💪",
    "Small steps every day lead to big success! 🚀",
    "தொடர்ந்து முயற்சி செய் நண்பா! வெற்றி நிச்சயம்! ❤️",
    "Never stop learning. Never stop growing! 🔥",
    "Mistakes are proof that you are trying! 💯"
  ];

  // Automatic language detection
  function detectLanguage(text) {
    if (/[\u0B80-\u0BFF]/.test(text)) {
      return "ta";
    }

    const tanglishPattern =
      /\b(naan|nan|neenga|ungal|epdi|eppadi|enna|irukka|irukku|pannu|pannunga|sollu|venum|illai|illa|seri|romba|nalla|inga|anga|poga|vandha|saptiya|sapten|bro|nanba)\b/i;

    if (tanglishPattern.test(text)) {
      return "tl";
    }

    return "en";
  }

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function askAI() {
    const text = question.value.trim();

    if (!text || send.disabled) return;

    const language = detectLanguage(text);

    addMessage(text, "user");

    question.value = "";
    question.style.height = "auto";
    send.disabled = true;
    send.textContent = "⏳";

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text,
          language: language
        })
      });

      if (!response.ok) {
        throw new Error("AI request failed");
      }

      const data = await response.json();

      const answer =
        data.reply || data.response || data.answer;

      if (!answer) {
        throw new Error("Empty AI response");
      }

      const greetings = {
        en: [
          "Good question bro! 👏",
          "Nice work, bro! 🔥"
        ],
        ta: [
          "அருமையான கேள்வி நண்பா! 👏",
          "நல்ல முயற்சி நண்பா! 🔥"
        ],
        tl: [
          "Super question bro! 👏",
          "Nalla work nanba! 🔥"
        ]
      };

      const options = greetings[language];

      const greeting =
        options[Math.floor(Math.random() * options.length)];

      addMessage(greeting + "\n\n" + answer, "bot");

      document.getElementById("quote").textContent =
        quotes[Math.floor(Math.random() * quotes.length)];

    } catch (error) {
      const errors = {
        en: "Sorry bro! AI connection problem. Please check Worker API.",
        ta: "மன்னிக்கவும் நண்பா! AI இணைப்பில் பிரச்சினை உள்ளது.",
        tl: "Sorry nanba! AI connection problem. Worker API check pannanum."
      };

      addMessage(errors[language], "bot");

    } finally {
      send.disabled = false;
      send.textContent = "➤";
      question.focus();
    }
  }

  send.addEventListener("click", askAI);

  question.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      askAI();
    }
  });

  question.addEventListener("input", () => {
    question.style.height = "auto";
    question.style.height =
      Math.min(question.scrollHeight, 120) + "px";
  });
</script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then(() => console.log("CyberNanban PWA ready!"))
      .catch(error => console.error("PWA error:", error));
  });
}
  </script>

</body>
</html>
