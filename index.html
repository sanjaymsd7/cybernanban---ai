
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Nanban AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #08111f;
  color: white;
  padding: 20px 12px;
}
.container {
  max-width: 700px;
  margin: 30px auto;
  padding: 22px;
  background: #142238;
  border-radius: 15px;
}
h1 { color: #38bdf8; text-align: center; }
.subtitle { text-align: center; color: #cbd5e1; }
textarea {
  width: 100%;
  height: 110px;
  box-sizing: border-box;
  padding: 12px;
  border-radius: 8px;
  font-size: 16px;
}
button {
  margin-top: 12px;
  padding: 12px 22px;
  background: #0284c7;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
#answer {
  text-align: left;
  margin-top: 22px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
#answer h1, #answer h2, #answer h3 {
  text-align: left;
  color: #38bdf8;
}
#answer pre {
  background: #050b14;
  padding: 15px;
  border-radius: 8px;
  overflow-x: auto;
}
#answer code {
  background: #26364d;
  padding: 3px 5px;
  border-radius: 4px;
}
#answer pre code {
  background: transparent;
  padding: 0;
}
#answer a { color: #38bdf8; }
.copy-btn { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
<h1>🛡️ Cyber Nanban AI</h1>
<p class="subtitle">Your Friendly AI Cybersecurity Assistant</p>

<textarea id="question" placeholder="Ask your cybersecurity question..."></textarea>
<br>
<button id="askButton" onclick="askAI()">Ask AI</button>

<div id="answer" aria-live="polite"></div>
</div>

<script>
async function askAI() {
  const question = document.getElementById("question").value.trim();
  const answer = document.getElementById("answer");
  const button = document.getElementById("askButton");

  if (!question) {
    answer.textContent = "Please enter your question.";
    return;
  }

  button.disabled = true;
  answer.textContent = "Cyber Nanban is thinking...";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: question })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI connection failed.");
    }

    answer.innerHTML = marked.parse(data.reply || "No response received.");

    answer.querySelectorAll("pre code").forEach(code => {
      const copy = document.createElement("button");
      copy.textContent = "Copy command";
      copy.className = "copy-btn";
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(code.textContent);
          copy.textContent = "Copied!";
        } catch {
          copy.textContent = "Copy unavailable";
        }
      };
      code.parentElement.after(copy);
    });

  } catch (error) {
    answer.textContent = "Sorry, AI connection failed. Please try again.";
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
