
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>CyberNanban AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 650px;
      padding: 22px 16px;
    }
    header { text-align: center; }
    h1 { color: #38e8c5; margin-bottom: 5px; }
    .subtitle { color: #aab8ca; }
    .language {
      display: flex;
      gap: 8px;
      margin: 22px 0;
    }
    button, select, textarea {
      font: inherit;
      border-radius: 10px;
    }
    .language button {
      flex: 1;
      padding: 11px 5px;
      border: 1px solid #40516a;
      color: white;
      background: #1d2a3d;
    }
    .language button.active {
      background: #087d70;
      border-color: #38e8c5;
    }
    #chat {
      min-height: 300px;
      max-height: 48vh;
      overflow-y: auto;
      padding: 14px;
      background: #182438;
      border-radius: 14px;
    }
    .message {
      padding: 12px;
      margin: 9px 0;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
    .bot { background: #263a50; }
    .user {
      background: #075e56;
      margin-left: 25px;
    }
    textarea {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      min-height: 85px;
      color: white;
      background: #1d2a3d;
      border: 1px solid #40516a;
      resize: vertical;
    }
    #send {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: #16b99e;
      color: #071b1a;
      border: none;
      font-weight: bold;
    }
    button { cursor: pointer; }
    #send:disabled { opacity: .5; }
    .quote {
      margin-top: 20px;
      padding: 16px;
      background: #1d2a3d;
      border-left: 3px solid #38e8c5;
      border-radius: 8px;
      color: #c5d4e5;
      text-align: center;
      line-height: 1.6;
    }
    footer {
      text-align: center;
      color: #8192a8;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
<main class="app">
  <header>
    <h1>⚡ CyberNanban AI</h1>
    <div class="subtitle">Your Friendly Cybersecurity Assistant</div>
  </header>

  <div class="language">
    <button class="active" data-lang="en">English</button>
    <button data-lang="ta">தமிழ்</button>
    <button data-lang="tl">Tanglish</button>
  </div>

  <div id="chat" aria-live="polite">
    <div class="message bot">
      Vanakkam நண்பா! 👋

      Welcome to CyberNanban AI.
      Ask me anything about cybersecurity!
    </div>
  </div>

  <textarea id="question"
    placeholder="Ask your cybersecurity question..."></textarea>
  <button id="send">🚀 Send Message</button>

  <div class="quote" id="quote">
    வென்றால் மகிழ்ச்சி, தோற்றால் பயிற்சி! 💪
  </div>

  <footer>CyberNanban AI • Learn. Practice. Protect.</footer>
</main>

<script>
  const chat = document.getElementById("chat");
  const question = document.getElementById("question");
  const send = document.getElementById("send");
  let language = "en";

  const quotes = [
    "வென்றால் மகிழ்ச்சி, தோற்றால் பயிற்சி! 💪",
    "Small steps every day lead to big success! 🚀",
    "தொடர்ந்து முயற்சி செய் நண்பா! வெற்றி நிச்சயம்! ❤️",
    "Never stop learning. Never stop growing! 🔥",
    "Mistakes are proof that you are trying. 💯"
  ];

  document.querySelectorAll("[data-lang]").forEach(button => {
    button.addEventListener("click", () => {
      language = button.dataset.lang;
      document.querySelectorAll("[data-lang]").forEach(b =>
        b.classList.toggle("active", b === button)
      );
      question.placeholder = language === "ta"
        ? "உங்கள் கேள்வியை உள்ளிடவும்..."
        : language === "tl"
        ? "Ungal question type pannunga..."
        : "Ask your cybersecurity question...";
    });
  });

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function askAI() {
    const text = question.value.trim();
    if (!text || send.disabled) return;

    addMessage(text, "user");
    question.value = "";
    send.disabled = true;
    send.textContent = "Thinking... ⏳";

    try {
      // Keep this endpoint aligned with your existing Worker.
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          language: language
        })
      });

      if (!response.ok) throw new Error("AI request failed");

      const data = await response.json();
      const answer = data.reply || data.response || data.answer;

      if (!answer) throw new Error("Empty AI response");

      const greetings = {
        en: ["Good question bro! 👏", "Nice work, bro! 🔥"],
        ta: ["அருமையான கேள்வி நண்பா! 👏", "நல்ல முயற்சி நண்பா! 🔥"],
        tl: ["Super question bro! 👏", "Nalla work nanba! 🔥"]
      };

      const greeting = greetings[language][
        Math.floor(Math.random() * greetings[language].length)
      ];

      addMessage(greeting + "\n\n" + answer, "bot");
      document.getElementById("quote").textContent =
        quotes[Math.floor(Math.random() * quotes.length)];
    } catch (error) {
      addMessage(
        language === "ta"
          ? "மன்னிக்கவும் நண்பா! AI இணைப்பில் பிரச்சினை உள்ளது. Worker API அமைப்பை சரிபார்க்க வேண்டும்."
          : language === "tl"
          ? "Sorry nanba! AI connection problem. Worker API check pannanum."
          : "Sorry bro! AI connection problem. Please check the Worker API configuration.",
        "bot"
      );
    } finally {
      send.disabled = false;
      send.textContent = "🚀 Send Message";
    }
  }

  send.addEventListener("click", askAI);

  question.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      askAI();
    }
  });
</script>
</body>
</html>
